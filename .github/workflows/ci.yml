name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

jobs:
  checks:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - tuning_fork
          - tuning_fork_composer
          - tuning_fork_drafter
          - tuning_fork_kino
          - tuning_fork_midi
          - tuning_fork_mt32
          - tuning_fork_samples
          - tuning_fork_speaker
          - tuning_fork_wma
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.package }}/deps
            ${{ matrix.package }}/_build
          key: ${{ runner.os }}-${{ matrix.package }}-${{ hashFiles(format('{0}/mix.lock', matrix.package)) }}
          restore-keys: ${{ runner.os }}-${{ matrix.package }}-

      - name: Deps
        working-directory: ${{ matrix.package }}
        run: mix deps.get

      - name: Format
        working-directory: ${{ matrix.package }}
        run: mix format --check-formatted

      - name: Credo
        working-directory: ${{ matrix.package }}
        run: mix credo --strict

      - name: Test
        working-directory: ${{ matrix.package }}
        run: mix test

      - name: Docs
        working-directory: ${{ matrix.package }}
        env:
          MIX_ENV: dev
        run: mix docs --warnings-as-errors
